<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>PeriCore</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1f3b"/>
      <stop offset="1" stop-color="#0b0d1a"/>
    </linearGradient>
    <linearGradient id="ring" gradientUnits="userSpaceOnUse" x1="8" y1="8" x2="248" y2="248">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- tile -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="none" stroke="url(#ring)" stroke-width="6" opacity="0.9"/>

  <!-- mouse body -->
  <path d="M128 44c-36 0-60 26-60 62v52c0 36 24 62 60 62s60-26 60-62v-52c0-36-24-62-60-62z"
        fill="none" stroke="url(#ring)" stroke-width="12" stroke-linejoin="round"/>
  <!-- button split + wheel -->
  <line x1="128" y1="50" x2="128" y2="96" stroke="url(#ring)" stroke-width="8" stroke-linecap="round"/>
  <line x1="74" y1="104" x2="182" y2="104" stroke="url(#ring)" stroke-width="6" stroke-linecap="round" opacity="0.6"/>

  <!-- glowing core -->
  <circle cx="128" cy="150" r="40" fill="url(#core)"/>
  <circle cx="128" cy="150" r="13" fill="#ffffff"/>

  <!-- battery badge -->
  <g transform="translate(150 176)">
    <rect x="0" y="0" width="76" height="40" rx="10" fill="#0b0d1a" stroke="#e5e7eb" stroke-width="5"/>
    <rect x="76" y="12" width="8" height="16" rx="3" fill="#e5e7eb"/>
    <rect x="9" y="9" width="46" height="22" rx="4" fill="#2ecc71"/>
  </g>
</svg>
