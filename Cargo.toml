[package]
name = "pericore"
version = "0.4.0"
edition = "2021"
description = "PeriCore - one fast app for Ajazz mice, Fantech keyboards, PlayStation controllers and system-wide sound presets"
repository = "https://github.com/hyperdargo/PeriCore"

[[bin]]
name = "PeriCore"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["gif", "png", "jpeg"] }
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
tray-icon = "0.19"
winreg = "0.52"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls_Dialogs",
    "Win32_System_SystemInformation",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
