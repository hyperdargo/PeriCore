[package]
name = "pericore-setup"
version = "0.1.0"
edition = "2021"
publish = false
description = "PeriCore installer: embeds PeriCore.exe and installs it per-user"

# Stand-alone: build PeriCore first (it is embedded), then this.
[workspace]

[[bin]]
name = "PeriCore-Setup"
path = "src/main.rs"

[dependencies]
anyhow = "1"
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mslnk = "0.1"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_System_Com"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
